    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CC46A"/>
      <stop offset="1" stop-color="#1e8e3e"/>
    </linearGradient>
    <linearGradient id="body2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9B417"/>
      <stop offset="1" stop-color="#C98A1B"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect y="690" width="1600" height="210" fill="url(#floor)"/>
